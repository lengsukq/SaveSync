name: Build Electron App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - windows
          - macos
          - both

jobs:
  build-windows:
    if: github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'both'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Build Electron app (Windows)
        run: electron-builder --win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ""

      - name: Upload artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: SaveSync-Windows-${{ github.sha }}
          path: release/*.exe
          retention-days: 30

  build-macos:
    if: github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'both'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Build Electron app (macOS)
        run: electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ""

      - name: Upload artifacts (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: SaveSync-macOS-${{ github.sha }}
          path: release/*.dmg
          retention-days: 30
