name: Build Electron App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - windows
          - macos
          - both

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ github.event.inputs.platform == 'windows' && [ 'windows-latest' ] || github.event.inputs.platform == 'macos' && [ 'macos-latest' ] || [ 'windows-latest', 'macos-latest' ] }}
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Build Electron app (Windows)
        if: matrix.platform == 'win'
        run: yarn electron:build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Electron app (macOS)
        if: matrix.platform == 'mac'
        run: yarn electron:build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: SaveSync-Windows-${{ github.sha }}
          path: release/*.exe
          retention-days: 30

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: SaveSync-macOS-${{ github.sha }}
          path: release/*.dmg
          retention-days: 30
